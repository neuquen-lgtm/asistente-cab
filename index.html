<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente CAB - Control CAB</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #121212; overflow: hidden; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center;}
        
        #face-container { display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 0.3s ease; margin-bottom: 20px;}
        .eyes { display: flex; gap: 50px; margin-bottom: 40px; }
        .eye { width: 60px; height: 60px; background-color: #00e676; border-radius: 50%; transition: all 0.3s ease; box-shadow: 0 0 15px rgba(0, 230, 118, 0.5); }
        .mouth { width: 120px; height: 15px; background-color: #00e676; border-radius: 20px; transition: all 0.2s ease; box-shadow: 0 0 15px rgba(0, 230, 118, 0.5); }
        
        .estado-reposo .eye { animation: blink 4s infinite; }
        @keyframes blink { 0%, 95%, 100% { transform: scaleY(1); } 97% { transform: scaleY(0.1); } }
        .estado-escuchando .eye { transform: scale(1.3); background-color: #00b0ff; box-shadow: 0 0 30px rgba(0, 176, 255, 0.8); }
        .estado-escuchando .mouth { width: 40px; height: 40px; border-radius: 50%; background-color: #00b0ff; }
        .estado-procesando .eye { background-color: #ffea00; animation: think 1s infinite alternate cubic-bezier(0.45, 0.05, 0.55, 0.95); }
        .estado-procesando .mouth { width: 60px; background-color: #ffea00; }
        @keyframes think { 0% { transform: translateX(-20px); } 100% { transform: translateX(20px); } }
        .estado-respondiendo .eye { background-color: #00e676; }
        .estado-respondiendo .mouth { animation: talk 0.15s infinite alternate; }
        @keyframes talk { 0% { transform: scaleY(1); } 100% { transform: scaleY(4); border-radius: 40%; } }
        
        /* NUEVO: PANEL DE LECTURA (TELEPROMPTER) */
        #pantalla-texto {
            display: none; /* Oculto por defecto */
            width: 85%;
            max-width: 600px;
            background-color: #1e1e1e;
            color: #00e676;
            padding: 20px;
            border-radius: 12px;
            font-size: 18px;
            line-height: 1.6;
            max-height: 35vh; /* Ocupa hasta el 35% de la pantalla */
            overflow-y: auto; /* Permite hacer scroll */
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #333;
            margin-bottom: 80px;
        }

        .controls { position: absolute; bottom: 20px; display: flex; gap: 10px; width: 100%; justify-content: center; }
        button { padding: 15px 25px; border: none; border-radius: 5px; background: #333; color: white; font-weight: bold; cursor: pointer; font-size: 16px;}
        button:hover { background: #555; }
    </style>
</head>
<body>
    <div id="face-container" class="estado-reposo">
        <div class="eyes">
            <div class="eye left"></div>
            <div class="eye right"></div>
        </div>
        <div class="mouth"></div>
    </div>

    <div id="pantalla-texto"></div>

    <div class="controls">
        <button onclick="iniciarInteraccion()">Hablar con CAB</button>
    </div>

    <script>
        const face = document.getElementById('face-container');
        const pantallaTexto = document.getElementById('pantalla-texto');
        
        function setEstado(nuevoEstado) {
            face.className = ''; 
            face.classList.add(nuevoEstado);
        }

        // RECUERDA: Si cambia tu IP, debes actualizarla aquí
        const socket = new WebSocket('ws://192.168.0.60:8765');

        socket.onopen = function(e) {
            console.log("Conectado exitosamente al backend");
        };

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            
            if (data.estado) {
                setEstado(data.estado);
                // Si vuelve a reposo o empieza a escuchar, podemos atenuar el texto o dejarlo
                if(data.estado === 'estado-escuchando') {
                    pantallaTexto.innerHTML = "<em>Escuchando...</em>";
                    pantallaTexto.style.display = 'block';
                }
                if(data.estado === 'estado-procesando') {
                    pantallaTexto.innerHTML = "<em>Buscando en los manuales de Control CAB...</em>";
                }
            }

            // NUEVO: Mostrar el texto en pantalla
            if (data.texto_pantalla) {
                pantallaTexto.innerHTML = data.texto_pantalla;
                pantallaTexto.style.display = 'block';
            }
            
            if (data.audio) {
                const audioRepro = new Audio("data:audio/mp3;base64," + data.audio);
                audioRepro.play();
                
                audioRepro.onended = function() {
                    setEstado('estado-reposo');
                };
            } else if (data.texto) {
                window.speechSynthesis.cancel();
                let vozActual = new SpeechSynthesisUtterance(data.texto);
                window.speechSynthesis.speak(vozActual);
            }
        };

        const Reconocimiento = window.SpeechRecognition || window.webkitSpeechRecognition;
        const reconocimientoVoz = new Reconocimiento();
        reconocimientoVoz.lang = 'es-AR'; 
        reconocimientoVoz.interimResults = false;

        reconocimientoVoz.onresult = function(event) {
            const textoEscuchado = event.results[0][0].transcript;
            socket.send(JSON.stringify({ accion: "procesar_texto", texto: textoEscuchado }));
        };

        reconocimientoVoz.onerror = function(event) {
            setEstado('estado-reposo'); 
            pantallaTexto.innerHTML = "<em>Error al escuchar. Intenta nuevamente.</em>";
        };

        function iniciarInteraccion() {
            if(socket.readyState === WebSocket.OPEN) {
                const audioVacio = new Audio("data:audio/mp3;base64,");
                audioVacio.play().catch(e => console.log("Audio desbloqueado"));
                
                reconocimientoVoz.start();
                setEstado('estado-escuchando');
            } else {
                alert("El servidor de Python no está conectado.");
            }
        }
    </script>
</body>
</html>
